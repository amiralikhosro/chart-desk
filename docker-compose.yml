services:
  chart-desk:
    build: .
    image: chart-desk:0.1.0
    container_name: chart-desk
    # Host networking: the LBank/OKX proxy must leave through the host's own route
    # (VPN tunnel). Bridged containers bypass it and LBank connections time out.
    network_mode: host
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-4173}
      DESK_DATA_DIR: /app/data
      DESK_TOKEN: ${DESK_TOKEN:-}
      # Optional login for the whole app (HTTP Basic, "user:password"); empty = off.
      DESK_AUTH: ${DESK_AUTH:-}
      # Optional phone push for server-side alerts (or set the topic in the Alerts panel).
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      # Link opened when you tap a phone notification, e.g. http://192.168.1.20:4173
      DESK_PUBLIC_URL: ${DESK_PUBLIC_URL:-}
    volumes:
      # Live long/short approval lines — push with:
      #   .venv/bin/python chart-desk/scripts/export_desk.py --push http://127.0.0.1:4173
      - ./data:/app/data
    restart: unless-stopped
